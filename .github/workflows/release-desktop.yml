name: Release Stage Desktop (macOS)

on:
  push:
    tags:
      - "v*" # testing track — CI artifacts only (no public GitHub Release)
      - "prod-v*" # production track — public GitHub Release (Latest)
  workflow_dispatch:
    inputs:
      track:
        description: Which environment to build (controls baked-in Convex/R2/auth URLs + secrets)
        type: choice
        options:
          - testing
          - production
        default: testing
      publish_release:
        description: Upload to GitHub Releases (requires tag on ref or manual assets only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - name: Pick environment from tag / dispatch input
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.track }}"
          elif [[ "${GITHUB_REF_NAME}" == prod-v* ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="testing"
          fi
          echo "Selected environment: ${ENVIRONMENT} (ref ${GITHUB_REF_NAME}, event ${{ github.event_name }})"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    env:
      VITE_CONVEX_URL: ${{ secrets.DESKTOP_VITE_CONVEX_URL }}
      # Public Brandfetch Logo Link client id (baked into the bundle at build time).
      VITE_BRANDFETCH_CLIENT_ID: ${{ secrets.VITE_BRANDFETCH_CLIENT_ID }}
      # Read-only PAT for in-app updates (private GitHub repo). Fine-grained: Contents read on getstage.
      STAGE_UPDATE_GITHUB_TOKEN: ${{ secrets.DESKTOP_UPDATE_GITHUB_TOKEN }}
      # Optional public feed, e.g. https://assets.getstage.co/desktop/macos — overrides GitHub when set.
      STAGE_DESKTOP_UPDATES_URL: ${{ vars.STAGE_DESKTOP_UPDATES_URL }}
      # Testing release: login via testing.getstage.co (override with repo variable for prod later)
      STAGE_DESKTOP_AUTH_URL: ${{ vars.STAGE_DESKTOP_AUTH_URL != '' && vars.STAGE_DESKTOP_AUTH_URL || 'https://testing.getstage.co/auth/desktop' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify desktop version matches tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/user-application/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#prod-}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Desktop package version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Require Convex URL for desktop build
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error::Set GitHub secret DESKTOP_VITE_CONVEX_URL (production Convex URL, e.g. https://xxx.convex.cloud)"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data-ops
        run: pnpm --filter @stage/data-ops run build

      - name: Build stage-engine (${{ matrix.arch }})
        run: |
          cargo build --release \
            --manifest-path apps/stage-engine/Cargo.toml \
            --target ${{ matrix.rust_target }}

      - name: Copy stage-engine into desktop resources
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        run: node apps/user-application/scripts/copy-stage-engine.mjs

      - name: Build Electron app
        run: pnpm --filter stage-user-application run build

      - name: Require R2 public base URL for desktop build
        run: |
          if [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "::error::Set GitHub secret R2_PUBLIC_BASE_URL (public R2 custom domain, e.g. https://assets.getstage.co)"
            exit 1
          fi
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Write packaged runtime config
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: node apps/user-application/scripts/write-runtime-secrets.mjs

      - name: Package DMG (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          cd apps/user-application
          MAC_BUILD_ARGS=(-c.mac.hardenedRuntime=false -c.mac.notarize=false)
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$CSC_LINK" ]; then
            MAC_BUILD_ARGS=(-c.mac.hardenedRuntime=true -c.mac.notarize=true)
            echo "Apple signing + notarization enabled"
          else
            echo "Building unsigned DMG (add APPLE_* and CSC_LINK secrets to sign)"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            pnpm exec electron-builder --mac --${{ matrix.arch }} "${MAC_BUILD_ARGS[@]}" --publish never
          else
            pnpm exec electron-builder --mac --${{ matrix.arch }} "${MAC_BUILD_ARGS[@]}" --publish never
          fi

      - name: Upload release artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Stage-mac-${{ matrix.arch }}
          path: |
            apps/user-application/release/*.dmg
            apps/user-application/release/*.zip
            apps/user-application/release/*.blockmap
            apps/user-application/release/latest-mac.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-macos
    # Testing tags (v*) stay internal: download DMGs from the workflow run artifacts.
    if: >
      (github.event_name == 'push' && startsWith(github.ref_name, 'prod-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.track == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: Stage-mac-arm64
          path: release-assets-arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: Stage-mac-x64
          path: release-assets-x64

      - name: Merge macOS update manifest (arm64 + x64)
        run: |
          mkdir -p release-assets
          node apps/user-application/scripts/merge-latest-mac-yml.mjs \
            release-assets-arm64/latest-mac.yml \
            release-assets-x64/latest-mac.yml \
            release-assets/latest-mac.yml
          cp release-assets-arm64/*.{dmg,zip,blockmap} release-assets/
          cp release-assets-x64/*.{dmg,zip,blockmap} release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#prod-v}"
          VERSION="${VERSION#v}"
          TITLE="Stage ${VERSION}"

          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --draft --title "$TITLE"

          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found to upload."
            exit 1
          fi

          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${assets[@]}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest --title "$TITLE"
