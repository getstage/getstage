<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #FFFFFF;
      --color-text-primary: #1A1A2E;
      --color-text-secondary: #8C8C8C;
      --color-text-tertiary: #BFBFBF;
      --color-border: #E8E8E8;
      --color-border-subtle: #F0F0F0;
      --color-accent-purple: #8782F5;
      --color-accent-purple-hover: #7670E0;
      --color-purple-light-bg: #EEEDFE;
      --color-green: #22C55E;
      --color-green-light: #EDFCF2;
      --color-amber: #D4890A;
      --color-amber-light: #FEF9EC;
      --color-red: #E07070;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--color-bg); color: var(--color-text-primary); width: 100%; max-width: 1440px; opacity: 0; transition: opacity 300ms ease; margin: 0 auto; min-height: 100vh; }
    .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif; }

    .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 16px 56px; }
    .topbar-logo { height: 22px; width: auto; display: block; }
    .profile-wrap { position: relative; }
    .profile-avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 2px solid var(--color-bg); box-shadow: 0 1px 3px rgba(26,26,46,0.08); transition: box-shadow 150ms; }
    .profile-avatar:hover { box-shadow: 0 2px 8px rgba(26,26,46,0.14); }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-dropdown { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 8px; padding: 4px; min-width: 140px; z-index: 50; box-shadow: 0 4px 16px rgba(26,26,46,0.08); }
    .profile-dropdown.visible { display: block; }
    .profile-menu-item { display: block; padding: 6px 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--color-text-primary); text-decoration: none; border-radius: 5px; cursor: pointer; transition: background 100ms; }
    .profile-menu-item:hover { background: var(--color-border-subtle); }
    .profile-menu-item.logout { color: var(--color-text-secondary); }
    .profile-divider { height: 1px; background: var(--color-border-subtle); margin: 4px 0; }

    .nav-row { max-width: 1200px; margin: 0 auto; padding: 8px 56px 24px 56px; display: flex; align-items: center; justify-content: space-between; }
    .nav-row-tabs { display: flex; align-items: center; gap: 8px; }
    .nav-row-actions { display: flex; align-items: center; gap: 8px; }
    .page-tab { display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); background: transparent; border: 1px solid var(--color-border); border-radius: 9px; cursor: pointer; text-decoration: none; transition: all 150ms; white-space: nowrap; }
    .page-tab:hover { border-color: var(--color-text-secondary); color: var(--color-text-primary); background: var(--color-border-subtle); }
    .page-tab.active { background: var(--color-text-primary); border-color: var(--color-text-primary); color: #fff; }
    .page-tab svg.tab-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--color-text-tertiary); transition: color 150ms; }
    .page-tab:hover svg.tab-icon { color: var(--color-text-secondary); }
    .page-tab.active svg.tab-icon { color: rgba(255,255,255,0.7); }
    .btn-ghost { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; background: transparent; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 13px; color: var(--color-text-secondary); border: 1px solid var(--color-border); border-radius: 9px; cursor: pointer; transition: all 150ms; }
    .btn-ghost:hover { border-color: var(--color-text-secondary); color: var(--color-text-primary); }
    .btn-ghost svg { width: 13px; height: 13px; }
    .btn-notion { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--color-bg); font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 13px; color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 9px; cursor: pointer; transition: all 150ms; }
    .btn-notion:hover { border-color: var(--color-text-secondary); background: var(--color-border-subtle); }
    .btn-notion img { width: 16px; height: 16px; }

    .project-hero { max-width: 1200px; margin: 0 auto; padding: 24px 56px 40px 56px; display: flex; align-items: flex-start; gap: 56px; }
    .project-hero-left { display: flex; align-items: flex-start; gap: 24px; }
    .progress-ring-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .progress-ring-wrap svg { width: 88px; height: 88px; transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--color-border-subtle); stroke-width: 4; }
    .progress-ring-fill { fill: none; stroke: var(--color-accent-purple); stroke-width: 4; stroke-linecap: round; }
    .progress-ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 22px; color: var(--color-text-primary); letter-spacing: -0.5px; }
    .project-identity { padding-top: 12px; }
    .project-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 26px; color: var(--color-text-primary); letter-spacing: -0.5px; line-height: 1.25; }
    .project-client { font-size: 14px; color: var(--color-text-secondary); margin-top: 4px; }
    .project-meta { margin-left: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 12px; flex-shrink: 0; }
    .meta-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-text-secondary); }
    .meta-icon { width: 16px; height: 16px; color: var(--color-text-tertiary); flex-shrink: 0; }
    .meta-label { color: var(--color-text-tertiary); min-width: 56px; }
    .meta-value { color: var(--color-text-primary); }
    .hero-divider { max-width: 1200px; margin: 0 auto; padding: 0 56px; }
    .hero-divider-line { height: 1px; background: var(--color-border); }

    .content { max-width: 1200px; margin: 0 auto; padding: 32px 56px 160px 56px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; text-align: center; }
    .empty-icon { margin-bottom: 20px; color: var(--color-text-tertiary); }
    .empty-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 22px; color: var(--color-text-primary); margin-bottom: 8px; letter-spacing: -0.3px; }
    .empty-subtitle { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; max-width: 400px; margin-bottom: 32px; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: #fff; background: var(--color-accent-purple); border: none; border-radius: 10px; cursor: pointer; transition: background 150ms; }
    .btn-primary:hover { background: var(--color-accent-purple-hover); }

    .config-panel { max-width: 560px; margin: 0 auto; padding: 48px 0; }
    .config-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 20px; color: var(--color-text-primary); margin-bottom: 6px; }
    .config-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 32px; line-height: 1.5; }
    .config-group { margin-bottom: 24px; }
    .config-label { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; }
    .config-hint { font-size: 12px; color: var(--color-text-tertiary); margin-top: 4px; }
    .config-input { width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--color-text-primary); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; outline: none; transition: border-color 200ms; }
    .config-input:focus { border-color: var(--color-accent-purple); }
    .config-textarea { width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--color-text-primary); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; outline: none; resize: vertical; min-height: 80px; transition: border-color 200ms; line-height: 1.5; }
    .config-textarea:focus { border-color: var(--color-accent-purple); }
    .config-textarea::placeholder { color: var(--color-text-tertiary); }
    .config-actions { display: flex; gap: 12px; margin-top: 32px; }
    .btn-secondary { padding: 12px 24px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); background: none; border: 1px solid var(--color-border); border-radius: 10px; cursor: pointer; transition: all 150ms; }
    .btn-secondary:hover { border-color: var(--color-text-secondary); color: var(--color-text-primary); }

    .running-state { padding: 64px 0; max-width: 480px; margin: 0 auto; text-align: center; }
    .running-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 20px; color: var(--color-text-primary); margin-bottom: 8px; }
    .running-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 40px; }
    .running-steps { text-align: left; }
    .running-step { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--color-border-subtle); }
    .running-step:last-child { border-bottom: none; }
    .running-step-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .running-step-icon.done { color: var(--color-green); }
    .running-step-icon.active { color: var(--color-accent-purple); }
    .running-step-icon.pending { color: var(--color-text-tertiary); }
    .running-step-text { font-size: 14px; color: var(--color-text-primary); }
    .running-step.pending .running-step-text { color: var(--color-text-tertiary); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }

    .approval-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--color-border-subtle); border-radius: 10px; margin-bottom: 32px; }
    .approval-bar-left { display: flex; align-items: center; gap: 12px; }
    .approval-progress { width: 120px; height: 4px; background: var(--color-border); border-radius: 2px; overflow: hidden; }
    .approval-progress-fill { height: 100%; background: var(--color-green); border-radius: 2px; transition: width 300ms ease; }
    .approval-text { font-size: 13px; color: var(--color-text-secondary); }
    .approval-text strong { color: var(--color-text-primary); font-weight: 500; }

    .strategy-doc { max-width: 720px; }
    .doc-section { margin-bottom: 8px; border-radius: 12px; border: 1px solid transparent; transition: border-color 150ms; }
    .doc-section:hover { border-color: var(--color-border); }
    .doc-section:hover .doc-section-actions { opacity: 1; }
    .doc-section-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0 16px; }
    .doc-section-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-weight: 600; font-size: 17px; color: var(--color-text-primary); letter-spacing: -0.2px; flex: 1; }
    .doc-section-badge { display: inline-flex; align-items: center; padding: 3px 10px; font-size: 11px; font-weight: 500; border-radius: 99px; flex-shrink: 0; }
    .doc-section-badge.draft { background: var(--color-border-subtle); color: var(--color-text-secondary); }
    .doc-section-badge.approved { background: var(--color-green-light); color: var(--color-green); }
    .doc-section-badge.revision { background: var(--color-amber-light); color: var(--color-amber); }
    .doc-section-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 150ms; }
    .doc-action-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: none; border: none; color: var(--color-text-tertiary); cursor: pointer; transition: all 150ms; }
    .doc-action-btn:hover { background: var(--color-border-subtle); color: var(--color-text-secondary); }
    .doc-action-btn svg { width: 14px; height: 14px; }
    .doc-section-body { font-size: 14px; line-height: 1.7; color: var(--color-text-secondary); padding: 10px 16px 14px 16px; border-radius: 8px; min-height: 40px; cursor: text; border: 1px solid transparent; transition: all 150ms; white-space: pre-wrap; }
    .doc-section-body:focus { outline: none; border-color: var(--color-accent-purple); color: var(--color-text-primary); background: rgba(135,130,245,0.02); }
    .doc-section-footer { display: flex; align-items: center; gap: 6px; padding: 4px 16px 12px 16px; }
    .approve-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; color: var(--color-green); background: var(--color-green-light); border: none; border-radius: 6px; cursor: pointer; transition: all 150ms; }
    .approve-btn:hover { background: #D1FAE5; }
    .approve-btn svg { width: 12px; height: 12px; }
    .revision-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; color: var(--color-amber); background: var(--color-amber-light); border: none; border-radius: 6px; cursor: pointer; transition: all 150ms; }
    .revision-btn:hover { background: #FEF0C7; }
    .add-section-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 1.5px dashed var(--color-border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--color-text-tertiary); background: none; cursor: pointer; transition: all 150ms; margin-top: 8px; margin-bottom: 32px; }
    .add-section-btn:hover { border-color: var(--color-accent-purple); color: var(--color-accent-purple); background: rgba(135,130,245,0.03); }
    .add-section-btn svg { width: 14px; height: 14px; }
    .continue-cta { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; background: var(--color-purple-light-bg); border-radius: 12px; margin-top: 16px; }
    .continue-cta-text { font-size: 14px; color: var(--color-text-primary); }
    .continue-cta-text span { color: var(--color-text-secondary); font-size: 13px; display: block; margin-top: 2px; }
    .btn-continue { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: #fff; background: var(--color-accent-purple); border: none; border-radius: 9px; cursor: pointer; transition: background 150ms; white-space: nowrap; }
    .btn-continue:hover { background: var(--color-accent-purple-hover); }
    .saved-indicator { position: fixed; top: 20px; right: 20px; font-size: 12px; color: var(--color-text-tertiary); opacity: 0; transition: opacity 300ms; z-index: 200; }
    .saved-indicator.visible { opacity: 1; }

    .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 150; }
    .dock-container { background: #151520; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 10px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.24); display: flex; align-items: flex-end; gap: 8px; }
    .dock-item { position: relative; width: 44px; height: 44px; flex-shrink: 0; cursor: pointer; }
    .dock-item img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 2px solid rgba(255,255,255,0.12); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .dock-item.active img { border: 2px solid var(--color-accent-purple); }
    .dock-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #333546; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 150ms; }
    .dock-tooltip.visible { opacity: 1; }
    .dock-tooltip-name { font-size: 13px; font-weight: 500; color: #fff; line-height: 1.3; }
    .dock-tooltip-client { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.3; }
  </style>
</head>

  <script>
    requestAnimationFrame(() => { document.body.style.opacity = '1'; });

    const sections = [
      { id: 's1', title: 'Goals & KPIs', status: 'approved', content: 'Redesign acmestudio.com to increase demo requests by 40% within 6 months. Key performance indicators: demo conversion rate (target 4.5%), bounce rate reduction (target <45%), average session duration (target >2min), and organic traffic growth (target +30% in 6 months). Secondary goals include establishing Acme as a thought leader in operations automation and supporting the sales team with better product storytelling.' },
      { id: 's2', title: 'User Journeys', status: 'approved', content: 'Three primary user journeys identified:\n\n1. The Evaluator — Operations manager researching solutions. Enters via Google/blog, needs to quickly understand what Acme does, see social proof, and reach a demo form within 3 clicks.\n\n2. The Decision Maker — VP/C-level comparing vendors. Enters via direct link or ad. Needs ROI data, enterprise features, and security/compliance information.\n\n3. The Existing User — Current customer exploring upgrades. Enters via dashboard link. Needs clear upgrade path and feature comparison.' },
      { id: 's3', title: 'Sitemap', status: 'draft', content: 'Proposed site architecture:\n\n/ — Homepage (hero, value props, social proof, CTA)\n/product — Product overview with feature deep-dives\n/solutions — Use-case pages by team type (Ops, IT, RevOps)\n/pricing — Transparent pricing with comparison table\n/customers — Case studies and testimonials\n/resources — Blog, guides, webinars, templates\n/company — About, careers, press\n/demo — Demo request form (conversion endpoint)' },
      { id: 's4', title: 'Page-by-Page Content Strategy', status: 'draft', content: 'Homepage: Lead with outcome ("Stop firefighting, start strategizing"), not features. Hero section shows the product in action, followed by 3 value propositions, social proof strip (logos + metric), featured case study, and persistent CTA.\n\nProduct page: Organized by workflow stages, not feature lists. Each section shows before/after of the problem it solves. Interactive demo embed at bottom.\n\nPricing: Three tiers (Starter, Growth, Enterprise) with feature comparison matrix. FAQ section addressing common objections. Annual discount prominently shown.' },
      { id: 's5', title: 'Conversion Approach', status: 'revision', content: 'Primary conversion: Demo request (gated by form — name, email, company, team size). Secondary conversion: Free trial signup (ungated, credit card not required).\n\nCTA hierarchy: Primary "Book a Demo" appears in header (sticky), hero, and page bottoms. Secondary "Start Free Trial" appears in pricing and product pages.\n\nNurture path: Blog readers → email capture via content upgrades → drip sequence → demo invitation. Target: 15% of email subscribers convert to demo within 30 days.' },
      { id: 's6', title: 'Technical Requirements', status: 'draft', content: 'Framework: Next.js with static generation for marketing pages, server-side rendering for dynamic content. CMS: Headless (Sanity or Contentful) for blog and case studies. Analytics: Mixpanel for product analytics, GA4 for marketing. Performance: Core Web Vitals compliance (LCP <2.5s, FID <100ms, CLS <0.1). Accessibility: WCAG 2.1 AA compliance. Hosting: Vercel with edge functions for personalization.' },
    ];

    let currentState = 'complete';
    const content = document.getElementById('content');
    const navActions = document.getElementById('navActions');
    const savedEl = document.getElementById('savedIndicator');

    function showSaved() { savedEl.classList.add('visible'); setTimeout(() => savedEl.classList.remove('visible'), 1500); }
    function getApprovalCount() { return sections.filter(s => s.status === 'approved').length; }
    function isAllApproved() { return sections.every(s => s.status === 'approved'); }

    function renderState() {
      switch (currentState) {
        case 'empty': renderEmpty(); break;
        case 'config': renderConfig(); break;
        case 'running': renderRunning(); break;
        case 'complete': renderComplete(); break;
      }
      renderNavActions();
    }

    function renderNavActions() {
      if (currentState === 'complete') {
        const badge = isAllApproved()
          ? '<span style="display:inline-flex;align-items:center;padding:4px 12px;background:var(--color-green-light);color:var(--color-green);font-size:12px;font-weight:500;border-radius:99px;">Approved</span>'
          : '<span style="display:inline-flex;align-items:center;padding:4px 12px;background:var(--color-purple-light-bg);color:var(--color-accent-purple);font-size:12px;font-weight:500;border-radius:99px;">' + getApprovalCount() + '/' + sections.length + ' approved</span>';
        navActions.innerHTML = badge + '<button class="btn-ghost" id="shareBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/><polyline points="8 2 8 10"/><polyline points="5 5 8 2 11 5"/></svg> Share</button>';
      } else { navActions.innerHTML = ''; }
    }

    function renderEmpty() {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h32v36H8z" rx="2"/><path d="M16 14h16M16 20h12M16 26h14M16 32h8"/></svg></div><div class="empty-title sf">Build your strategy</div><div class="empty-subtitle">AI will generate a comprehensive website strategy based on your research findings. You can edit every section like a Notion page.</div><button class="btn-primary" id="startBtn">Generate Strategy</button></div>';
      document.getElementById('startBtn').addEventListener('click', () => { currentState = 'config'; renderState(); });
    }

    function renderConfig() {
      content.innerHTML = '<div class="config-panel"><div class="config-title sf">Configure strategy</div><div class="config-subtitle">Add any preferences or constraints to guide the AI. The strategy will be built on your completed research.</div><div class="config-group"><label class="config-label">Strategy type</label><input class="config-input" value="Website Strategy" disabled style="background:var(--color-border-subtle);color:var(--color-text-secondary);"><div class="config-hint">Based on your project type</div></div><div class="config-group"><label class="config-label">Preferences or constraints</label><textarea class="config-textarea" placeholder="e.g. Focus on conversion optimization, we\'re targeting enterprise buyers, keep the tone professional but approachable..."></textarea><div class="config-hint">Optional — helps AI tailor the strategy</div></div><div class="config-actions"><button class="btn-primary" id="genBtn">Generate Strategy</button><button class="btn-secondary" id="cancelBtn">Cancel</button></div></div>';
      document.getElementById('genBtn').addEventListener('click', () => { currentState = 'running'; renderState(); });
      document.getElementById('cancelBtn').addEventListener('click', () => { currentState = 'empty'; renderState(); });
    }

    function renderRunning() {
      const names = sections.map(s => s.title);
      content.innerHTML = '<div class="running-state"><div style="margin-bottom:24px;"><svg class="spinner" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="var(--color-accent-purple)" stroke-width="3" stroke-linecap="round"><path d="M24 4a20 20 0 0 1 20 20"/></svg></div><div class="running-title sf">Writing strategy...</div><div class="running-subtitle">Building each section from your research findings.</div><div class="running-steps" id="rs">' + names.map((n,i) => '<div class="running-step' + (i>0?' pending':'') + '" data-step="'+i+'"><div class="running-step-icon '+(i===0?'active':'pending')+'">' + (i===0?'<svg class="spinner" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2a6 6 0 0 1 6 6"/></svg>':'<svg viewBox="0 0 16 16" width="18" height="18" fill="none"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>') + '</div><div class="running-step-text">'+n+'</div></div>').join('') + '</div></div>';
      const steps = document.querySelectorAll('.running-step');
      const chk = '<svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 6 11 13 4"/></svg>';
      const spn = '<svg class="spinner" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2a6 6 0 0 1 6 6"/></svg>';
      let i=0;
      function next() {
        if(i>0){const p=steps[i-1];p.classList.remove('pending');p.querySelector('.running-step-icon').className='running-step-icon done';p.querySelector('.running-step-icon').innerHTML=chk;}
        if(i<steps.length){const c=steps[i];c.classList.remove('pending');c.querySelector('.running-step-icon').className='running-step-icon active';c.querySelector('.running-step-icon').innerHTML=spn;i++;setTimeout(next,800+Math.random()*600);}
        else{setTimeout(()=>{currentState='complete';renderState();},500);}
      }
      setTimeout(next,600);
    }

    function renderComplete() {
      const approved = getApprovalCount(), total = sections.length, pct = Math.round((approved/total)*100);
      const rSvg='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8a6 6 0 0 1 6-6 6 6 0 0 1 6 6"/><path d="M2 8a6 6 0 0 0 6 6 6 6 0 0 0 6-6"/><polyline points="12 2 14 4.5 11.5 5.5"/></svg>';
      const nSvg='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10l-4 4H4v-4l4-4m4 0l2-2-4-4-2 2m4 4l-4-4"/></svg>';
      const cSvg='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg>';

      content.innerHTML = '<div style="display:flex;justify-content:flex-end;margin-bottom:24px;"><button class="btn-notion"><img src="https://www.google.com/s2/favicons?domain=notion.so&sz=64" alt="Notion"> Add to Notion</button></div><div class="strategy-doc"><div class="approval-bar"><div class="approval-bar-left"><div class="approval-progress"><div class="approval-progress-fill" style="width:'+pct+'%"></div></div><div class="approval-text"><strong>'+approved+' of '+total+'</strong> sections approved</div></div></div>' +
        sections.map(s => '<div class="doc-section" data-id="'+s.id+'"><div class="doc-section-header"><div class="doc-section-title">'+s.title+'</div><span class="doc-section-badge '+s.status+'">'+(s.status==='approved'?'Approved':s.status==='revision'?'Needs revision':'Draft')+'</span><div class="doc-section-actions"><button class="doc-action-btn" title="Regenerate">'+rSvg+'</button><button class="doc-action-btn" title="Add note">'+nSvg+'</button></div></div><div class="doc-section-body" contenteditable="true" data-id="'+s.id+'">'+s.content+'</div><div class="doc-section-footer">'+(s.status!=='approved'?'<button class="approve-btn" data-id="'+s.id+'">'+cSvg+' Approve</button>':'')+(s.status!=='revision'&&s.status!=='approved'?'<button class="revision-btn" data-id="'+s.id+'">Request revision</button>':'')+'</div></div>').join('') +
        '<button class="add-section-btn" id="addSectionBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg> Add section</button>' +
        (isAllApproved()?'<div class="continue-cta"><div class="continue-cta-text">Strategy approved<span>Continue to generate designs based on this strategy.</span></div><a class="btn-continue" href="generate-prototype.html">Continue to Generate <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 3 11 8 6 13"/></svg></a></div>':'') +
        '</div>';

      document.querySelectorAll('.approve-btn').forEach(b => { b.addEventListener('click', () => { const s=sections.find(x=>x.id===b.dataset.id); if(s){s.status='approved';showSaved();renderComplete();renderNavActions();} }); });
      document.querySelectorAll('.revision-btn').forEach(b => { b.addEventListener('click', () => { const s=sections.find(x=>x.id===b.dataset.id); if(s){s.status='revision';showSaved();renderComplete();renderNavActions();} }); });
      document.querySelectorAll('.doc-section-body[contenteditable]').forEach(el => { el.addEventListener('blur', () => { const s=sections.find(x=>x.id===el.dataset.id); if(s){s.content=el.textContent;showSaved();} }); });
      document.getElementById('addSectionBtn').addEventListener('click', () => { sections.push({id:'s'+(sections.length+1),title:'New Section',status:'draft',content:''}); renderComplete(); renderNavActions(); });
    }

    currentState = 'complete';
    renderState();

    // Profile
    (function(){const t=document.getElementById('profileToggle'),d=document.getElementById('profileDropdown');t.addEventListener('click',(e)=>{e.stopPropagation();d.classList.toggle('visible');});document.addEventListener('click',()=>d.classList.remove('visible'));})();

    // Tabs
    document.querySelectorAll('.page-tab').forEach(tab=>{tab.addEventListener('click',(e)=>{e.preventDefault();if(tab.classList.contains('active'))return;document.body.style.transition='opacity 150ms ease-out';document.body.style.opacity='0';setTimeout(()=>{window.location.href=tab.dataset.href;},180);});});

    // Dock
    (function(){const dp=[{name:'Website Redesign',client:'Acme Studio',avatar:'https://randomuser.me/api/portraits/men/32.jpg'},{name:'Brand Identity',client:'Nomad Co',avatar:'https://randomuser.me/api/portraits/women/68.jpg'},{name:'App Design',client:'Pulse Labs',avatar:'https://randomuser.me/api/portraits/men/75.jpg'},{name:'Social Campaign',client:'Vibe Co',avatar:'https://randomuser.me/api/portraits/women/22.jpg'},{name:'Product Strategy',client:'Luna Digital',avatar:'https://randomuser.me/api/portraits/women/50.jpg'},{name:'Editorial Design',client:'Oak Press',avatar:'https://randomuser.me/api/portraits/men/85.jpg'}];const B=44,M=72,S=55,c=document.getElementById('dockContainer');c.innerHTML=dp.map((p,i)=>'<div class="dock-item'+(i===0?' active':'')+'" data-idx="'+i+'"><div class="dock-tooltip"><div class="dock-tooltip-name">'+p.name+'</div><div class="dock-tooltip-client">'+p.client+'</div></div><img src="'+p.avatar+'" alt="'+p.name+'"></div>').join('');const items=[...c.querySelectorAll('.dock-item')];function mag(x){let ci=0,md=Infinity;items.forEach((it,i)=>{const r=it.getBoundingClientRect(),cx=r.left+r.width/2,d=Math.abs(x-cx),sc=Math.exp(-(d*d)/(2*S*S)),sz=Math.round(B+(M-B)*sc);it.style.width=sz+'px';it.style.height=sz+'px';if(d<md){md=d;ci=i;}});items.forEach((it,i)=>{const t=it.querySelector('.dock-tooltip');if(i===ci)t.classList.add('visible');else t.classList.remove('visible');});}c.addEventListener('mouseenter',()=>{items.forEach(it=>{it.style.transition='none';});});c.addEventListener('mousemove',(e)=>{mag(e.clientX);});c.addEventListener('mouseleave',()=>{items.forEach(it=>{it.style.transition='width 200ms ease, height 200ms ease';it.style.width=B+'px';it.style.height=B+'px';it.querySelector('.dock-tooltip').classList.remove('visible');});});items.forEach(it=>{it.addEventListener('click',()=>{document.body.style.opacity='0';setTimeout(()=>{window.location.href='project-detail-prototype.html';},300);});});})();
  </script>
</body>
</html>
