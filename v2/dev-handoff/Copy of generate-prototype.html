<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage — Generate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --color-bg:#FFFFFF; --color-text-primary:#1A1A2E; --color-text-secondary:#8C8C8C; --color-text-tertiary:#BFBFBF; --color-border:#E8E8E8; --color-border-subtle:#F0F0F0; --color-accent-purple:#8782F5; --color-accent-purple-hover:#7670E0; --color-purple-light-bg:#EEEDFE; --color-green:#22C55E; --color-green-light:#EDFCF2; --color-red:#E07070; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--color-bg);color:var(--color-text-primary);width:100%;max-width:1440px;opacity:0;transition:opacity 300ms ease;margin:0 auto;min-height:100vh;}
    .sf{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;}

    /* Shared layout */
    .topbar{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:16px 56px;}
    .topbar-logo{height:22px;width:auto;display:block;}
    .profile-wrap{position:relative;}.profile-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid var(--color-bg);box-shadow:0 1px 3px rgba(26,26,46,0.08);transition:box-shadow 150ms;}.profile-avatar:hover{box-shadow:0 2px 8px rgba(26,26,46,0.14);}.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .profile-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--color-bg);border:1px solid var(--color-border);border-radius:8px;padding:4px;min-width:140px;z-index:50;box-shadow:0 4px 16px rgba(26,26,46,0.08);}.profile-dropdown.visible{display:block;}
    .profile-menu-item{display:block;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--color-text-primary);text-decoration:none;border-radius:5px;cursor:pointer;transition:background 100ms;}.profile-menu-item:hover{background:var(--color-border-subtle);}.profile-menu-item.logout{color:var(--color-text-secondary);}.profile-divider{height:1px;background:var(--color-border-subtle);margin:4px 0;}

    .nav-row{max-width:1200px;margin:0 auto;padding:8px 56px 24px 56px;display:flex;align-items:center;justify-content:space-between;}
    .nav-row-tabs{display:flex;align-items:center;gap:8px;}.nav-row-actions{display:flex;align-items:center;gap:8px;}
    .page-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--color-text-secondary);background:transparent;border:1px solid var(--color-border);border-radius:9px;cursor:pointer;text-decoration:none;transition:all 150ms;white-space:nowrap;}
    .page-tab:hover{border-color:var(--color-text-secondary);color:var(--color-text-primary);background:var(--color-border-subtle);}.page-tab.active{background:var(--color-text-primary);border-color:var(--color-text-primary);color:#fff;}
    .page-tab svg.tab-icon{width:16px;height:16px;flex-shrink:0;color:var(--color-text-tertiary);transition:color 150ms;}
    .page-tab:hover svg.tab-icon{color:var(--color-text-secondary);}
    .page-tab.active svg.tab-icon{color:rgba(255,255,255,0.7);}
    .btn-ghost{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;background:transparent;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;color:var(--color-text-secondary);border:1px solid var(--color-border);border-radius:9px;cursor:pointer;transition:all 150ms;}.btn-ghost:hover{border-color:var(--color-text-secondary);color:var(--color-text-primary);}.btn-ghost svg{width:13px;height:13px;}

    .project-hero{max-width:1200px;margin:0 auto;padding:24px 56px 40px 56px;display:flex;align-items:flex-start;gap:56px;}
    .project-hero-left{display:flex;align-items:flex-start;gap:24px;}
    .progress-ring-wrap{position:relative;width:88px;height:88px;flex-shrink:0;}.progress-ring-wrap svg{width:88px;height:88px;transform:rotate(-90deg);}.progress-ring-bg{fill:none;stroke:var(--color-border-subtle);stroke-width:4;}.progress-ring-fill{fill:none;stroke:var(--color-accent-purple);stroke-width:4;stroke-linecap:round;}.progress-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:600;font-size:22px;color:var(--color-text-primary);letter-spacing:-0.5px;}
    .project-identity{padding-top:12px;}.project-title{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:600;font-size:26px;color:var(--color-text-primary);letter-spacing:-0.5px;line-height:1.25;}.project-client{font-size:14px;color:var(--color-text-secondary);margin-top:4px;}
    .project-meta{margin-left:auto;display:flex;flex-direction:column;gap:14px;padding-top:12px;flex-shrink:0;}.meta-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--color-text-secondary);}.meta-icon{width:16px;height:16px;color:var(--color-text-tertiary);flex-shrink:0;}.meta-label{color:var(--color-text-tertiary);min-width:56px;}.meta-value{color:var(--color-text-primary);}
    .hero-divider{max-width:1200px;margin:0 auto;padding:0 56px;}.hero-divider-line{height:1px;background:var(--color-border);}
    .content{max-width:1200px;margin:0 auto;padding:32px 56px 160px 56px;}

    /* ===== TYPE SELECTOR ===== */
    .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px;}
    .type-card{padding:20px;border:1px solid var(--color-border);border-radius:12px;cursor:pointer;transition:all 150ms;position:relative;}
    .type-card:hover{border-color:var(--color-text-tertiary);}
    .type-card.active{border-color:var(--color-accent-purple);background:rgba(135,130,245,0.03);}
    .type-card.locked{opacity:0.5;cursor:default;pointer-events:none;}
    .type-card-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--color-border-subtle);border-radius:8px;margin-bottom:12px;color:var(--color-text-secondary);}
    .type-card.active .type-card-icon{background:var(--color-purple-light-bg);color:var(--color-accent-purple);}
    .type-card-icon svg{width:18px;height:18px;}
    .type-card-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
    .type-card-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.5;}
    .type-card-lock{position:absolute;top:12px;right:12px;font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px;}
    .type-card-lock svg{width:12px;height:12px;}

    /* ===== CONFIG ===== */
    .config-panel{max-width:560px;margin:0 auto;padding:24px 0;}
    .config-title{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:600;font-size:20px;color:var(--color-text-primary);margin-bottom:6px;}
    .config-subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:28px;line-height:1.5;}
    .config-group{margin-bottom:24px;}
    .config-label{display:block;font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px;}
    .config-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:4px;}
    .config-textarea{width:100%;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--color-text-primary);background:var(--color-bg);border:1px solid var(--color-border);border-radius:10px;outline:none;resize:vertical;min-height:80px;transition:border-color 200ms;line-height:1.5;}
    .config-textarea:focus{border-color:var(--color-accent-purple);}
    .config-textarea::placeholder{color:var(--color-text-tertiary);}
    .config-actions{display:flex;gap:12px;margin-top:28px;}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:#fff;background:var(--color-accent-purple);border:none;border-radius:10px;cursor:pointer;transition:background 150ms;}
    .btn-primary:hover{background:var(--color-accent-purple-hover);}
    .btn-secondary{padding:12px 24px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--color-text-secondary);background:none;border:1px solid var(--color-border);border-radius:10px;cursor:pointer;transition:all 150ms;}
    .btn-secondary:hover{border-color:var(--color-text-secondary);color:var(--color-text-primary);}

    /* Page checkboxes */
    .page-checks{display:flex;flex-direction:column;gap:6px;}
    .page-check{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--color-border);border-radius:8px;cursor:pointer;transition:all 150ms;font-size:14px;color:var(--color-text-primary);}
    .page-check:hover{border-color:var(--color-text-tertiary);}
    .page-check.selected{border-color:var(--color-accent-purple);background:rgba(135,130,245,0.04);}
    .page-check-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 150ms;}
    .page-check.selected .page-check-box{background:var(--color-accent-purple);border-color:var(--color-accent-purple);}
    .page-check.selected .page-check-box svg{opacity:1;}
    .page-check-box svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity 150ms;}

    /* ===== RUNNING ===== */
    .running-state{padding:64px 0;max-width:480px;margin:0 auto;text-align:center;}
    .running-title{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:600;font-size:20px;color:var(--color-text-primary);margin-bottom:8px;}
    .running-subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:40px;}
    .running-steps{text-align:left;}
    .running-step{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--color-border-subtle);}
    .running-step:last-child{border-bottom:none;}
    .running-step-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .running-step-icon.done{color:var(--color-green);}.running-step-icon.active{color:var(--color-accent-purple);}.running-step-icon.pending{color:var(--color-text-tertiary);}
    .running-step-text{font-size:14px;color:var(--color-text-primary);}.running-step.pending .running-step-text{color:var(--color-text-tertiary);}
    @keyframes spin{to{transform:rotate(360deg);}}.spinner{animation:spin 1s linear infinite;}

    /* ===== WIREFRAME RESULTS ===== */
    .wireframe-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .wireframe-card{border:1px solid var(--color-border);border-radius:12px;overflow:hidden;transition:border-color 150ms;}
    .wireframe-card:hover{border-color:var(--color-text-tertiary);}
    .wireframe-preview{width:100%;aspect-ratio:4/3;background:var(--color-border-subtle);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);font-size:13px;position:relative;overflow:hidden;}
    .wireframe-preview-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;}
    .wireframe-preview-placeholder svg{width:32px;height:32px;color:var(--color-border);}
    .wireframe-info{padding:16px;}
    .wireframe-name{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
    .wireframe-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:12px;}
    .wireframe-actions{display:flex;gap:8px;}
    .wireframe-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;transition:all 150ms;border:none;}
    .wireframe-btn.primary{color:#fff;background:var(--color-accent-purple);}.wireframe-btn.primary:hover{background:var(--color-accent-purple-hover);}
    .wireframe-btn.secondary{color:var(--color-text-secondary);background:var(--color-border-subtle);border:1px solid var(--color-border);}.wireframe-btn.secondary:hover{border-color:var(--color-text-secondary);color:var(--color-text-primary);}
    .wireframe-btn svg{width:12px;height:12px;}

    /* Delivery bar */
    .delivery-bar{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:var(--color-purple-light-bg);border-radius:12px;margin-top:32px;}
    .delivery-text{font-size:14px;color:var(--color-text-primary);}
    .delivery-text span{color:var(--color-text-secondary);font-size:13px;display:block;margin-top:2px;}
    .delivery-actions{display:flex;gap:8px;}

    /* Dock */
    .dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:150;}.dock-container{background:#151520;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:10px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.24);display:flex;align-items:flex-end;gap:8px;}.dock-item{position:relative;width:44px;height:44px;flex-shrink:0;cursor:pointer;}.dock-item img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid rgba(255,255,255,0.12);box-shadow:0 2px 8px rgba(0,0,0,0.2);}.dock-item.active img{border:2px solid var(--color-accent-purple);}.dock-tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#333546;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,0.3);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 150ms;}.dock-tooltip.visible{opacity:1;}.dock-tooltip-name{font-size:13px;font-weight:500;color:#fff;line-height:1.3;}.dock-tooltip-client{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.3;}
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="dashboard-prototype.html"><img src="FULaL LOGO - Light mode.png" alt="Stage" class="topbar-logo"></a>
    <div class="profile-wrap"><div class="profile-avatar" id="profileToggle"><img src="https://randomuser.me/api/portraits/men/46.jpg" alt="Profile"></div><div class="profile-dropdown" id="profileDropdown"><a href="settings-prototype.html" class="profile-menu-item">Settings</a><a href="settings-prototype.html?tab=billing" class="profile-menu-item">Plan & Billing</a><div class="profile-divider"></div><a href="#" class="profile-menu-item logout">Log out</a></div></div>
  </nav>

  <div class="nav-row">
    <div class="nav-row-tabs">
      <a class="page-tab" data-href="project-detail-prototype.html"><svg class="tab-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg> Overview</a>
      <a class="page-tab" data-href="research-prototype.html"><svg class="tab-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg> Research</a>
      <a class="page-tab" data-href="strategy-prototype.html"><svg class="tab-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10v10H3z" rx="1"/><path d="M6 6h4M6 8.5h4M6 11h2.5"/></svg> Strategy</a>
      <a class="page-tab active" data-href="generate-prototype.html"><svg class="tab-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.5 3.5L13 7l-3 2.5L11 13l-3-2-3 2 1-3.5L3 7l3.5-1.5z"/></svg> Generate</a>
      <a class="page-tab" data-href="assets-prototype.html"><svg class="tab-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12v8H2z" rx="1.5"/><circle cx="5.5" cy="7" r="1.5" stroke-width="1"/><path d="M2 11l3.5-3 2.5 2 3-3.5L14 10" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg> Assets</a>
    </div>
    <div class="nav-row-actions" id="navActions"></div>
  </div>

  <section class="project-hero">
    <div class="project-hero-left">
      <div class="progress-ring-wrap"><svg viewBox="0 0 88 88"><circle class="progress-ring-bg" cx="44" cy="44" r="38"/><circle class="progress-ring-fill" cx="44" cy="44" r="38" stroke-dasharray="238.76" stroke-dashoffset="114.6"/></svg><span class="progress-ring-text">52</span></div>
      <div class="project-identity"><div class="project-title sf">Website Redesign</div><div class="project-client">Acme Studio</div></div>
    </div>
    <div class="project-meta">
      <div class="meta-item"><svg class="meta-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12"/><path d="M5.5 1.5v3M10.5 1.5v3"/></svg><span class="meta-label">Timeline</span><span class="meta-value">Mar 10 – May 15</span></div>
      <div class="meta-item"><svg class="meta-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg><span class="meta-label">Type</span><span class="meta-value">Website Design</span></div>
      <div class="meta-item"><svg class="meta-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10v10H3z" rx="1"/><path d="M6 6h4M6 8.5h4M6 11h2.5"/></svg><span class="meta-label">Scope</span><span class="meta-value">5 phases · 21 tasks</span></div>
    </div>
  </section>
  <div class="hero-divider"><div class="hero-divider-line"></div></div>

  <div class="content" id="content"></div>
  <div class="dock"><div class="dock-container" id="dockContainer"></div></div>

  <script>
    requestAnimationFrame(() => { document.body.style.opacity = '1'; });

    let currentState = 'select'; // 'select' | 'config' | 'running' | 'complete'
    const content = document.getElementById('content');
    const navActions = document.getElementById('navActions');

    const wireframes = [
      { id: 'w1', name: 'Homepage', desc: 'Hero, value props, social proof, CTA', selected: true },
      { id: 'w2', name: 'Product', desc: 'Feature overview with workflow stages', selected: true },
      { id: 'w3', name: 'Pricing', desc: 'Three tiers with comparison matrix', selected: true },
      { id: 'w4', name: 'Customers', desc: 'Case studies and testimonials grid', selected: false },
      { id: 'w5', name: 'Demo', desc: 'Conversion form with social proof sidebar', selected: true },
    ];

    function renderState() {
      switch (currentState) {
        case 'select': renderSelect(); break;
        case 'config': renderConfig(); break;
        case 'running': renderRunning(); break;
        case 'complete': renderComplete(); break;
      }
      navActions.innerHTML = currentState === 'complete'
        ? '<span style="display:inline-flex;align-items:center;padding:4px 12px;background:var(--color-green-light);color:var(--color-green);font-size:12px;font-weight:500;border-radius:99px;">Generated</span><button class="btn-ghost"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/><polyline points="8 2 8 10"/><polyline points="5 5 8 2 11 5"/></svg> Share</button>'
        : '';
    }

    function renderSelect() {
      const lockSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="8" height="7" rx="1"/><path d="M6 7V5a2 2 0 0 1 4 0v2"/></svg>';
      content.innerHTML = `
        <div class="type-grid">
          <div class="type-card active" id="typeWireframes">
            <div class="type-card-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="14" height="14" rx="2"/><path d="M2 6h14M6 6v10"/></svg></div>
            <div class="type-card-title">Website Wireframes</div>
            <div class="type-card-desc">Page-by-page wireframes based on your sitemap and content strategy.</div>
          </div>
          <div class="type-card locked">
            <div class="type-card-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l2.5 1.5"/></svg></div>
            <div class="type-card-title">Brand Concepts</div>
            <div class="type-card-desc">Visual directions with colors, typography, and mood boards.</div>
            <div class="type-card-lock">${lockSvg} Requires brand strategy</div>
          </div>
          <div class="type-card locked">
            <div class="type-card-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v12H3z" rx="1"/><path d="M6 7h6M6 9.5h4M6 12h5"/></svg></div>
            <div class="type-card-title">Design System</div>
            <div class="type-card-desc">Extract design tokens from your Figma file.</div>
            <div class="type-card-lock">${lockSvg} Requires brand concepts + Figma</div>
          </div>
          <div class="type-card locked">
            <div class="type-card-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="10" height="14" rx="2"/><path d="M7 12h4"/></svg></div>
            <div class="type-card-title">Product Wireframes</div>
            <div class="type-card-desc">Screen-by-screen wireframes for product design.</div>
            <div class="type-card-lock">${lockSvg} Requires product strategy</div>
          </div>
        </div>
        <div style="text-align:center;"><button class="btn-primary" id="configBtn">Configure Wireframes</button></div>
      `;
      document.getElementById('configBtn').addEventListener('click', () => { currentState = 'config'; renderState(); });
    }

    function renderConfig() {
      const checkSvg = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg>';
      content.innerHTML = `
        <div class="config-panel">
          <div class="config-title sf">Configure wireframes</div>
          <div class="config-subtitle">Select which pages to generate. These come from your sitemap in the strategy.</div>
          <div class="config-group">
            <label class="config-label">Pages to generate</label>
            <div class="page-checks" id="pageChecks">
              ${wireframes.map(w => `<div class="page-check${w.selected ? ' selected' : ''}" data-id="${w.id}"><div class="page-check-box">${checkSvg}</div><div><div style="font-weight:500;">${w.name}</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;">${w.desc}</div></div></div>`).join('')}
            </div>
          </div>
          <div class="config-group">
            <label class="config-label">Style preferences</label>
            <textarea class="config-textarea" placeholder="e.g. Clean and minimal, lots of whitespace, modern SaaS feel, prominent CTAs..."></textarea>
            <div class="config-hint">Optional — guides the visual direction of wireframes</div>
          </div>
          <div class="config-actions">
            <button class="btn-primary" id="genBtn">Generate ${wireframes.filter(w => w.selected).length} Wireframes</button>
            <button class="btn-secondary" id="backBtn">Back</button>
          </div>
        </div>
      `;
      document.querySelectorAll('.page-check').forEach(el => {
        el.addEventListener('click', () => {
          const w = wireframes.find(x => x.id === el.dataset.id);
          if (w) { w.selected = !w.selected; renderConfig(); }
        });
      });
      document.getElementById('genBtn').addEventListener('click', () => { currentState = 'running'; renderState(); });
      document.getElementById('backBtn').addEventListener('click', () => { currentState = 'select'; renderState(); });
    }

    function renderRunning() {
      const selected = wireframes.filter(w => w.selected);
      content.innerHTML = `<div class="running-state">
        <div style="margin-bottom:24px;"><svg class="spinner" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="var(--color-accent-purple)" stroke-width="3" stroke-linecap="round"><path d="M24 4a20 20 0 0 1 20 20"/></svg></div>
        <div class="running-title sf">Generating wireframes...</div>
        <div class="running-subtitle">Creating ${selected.length} page layouts based on your strategy.</div>
        <div class="running-steps" id="rs">${selected.map((w,i) => '<div class="running-step'+(i>0?' pending':'')+'" data-step="'+i+'"><div class="running-step-icon '+(i===0?'active':'pending')+'">'+(i===0?'<svg class="spinner" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2a6 6 0 0 1 6 6"/></svg>':'<svg viewBox="0 0 16 16" width="18" height="18" fill="none"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>')+'</div><div class="running-step-text">'+w.name+'</div></div>').join('')}</div>
      </div>`;
      const steps = document.querySelectorAll('.running-step');
      const chk='<svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 6 11 13 4"/></svg>';
      const spn='<svg class="spinner" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2a6 6 0 0 1 6 6"/></svg>';
      let i=0;
      function next(){if(i>0){const p=steps[i-1];p.classList.remove('pending');p.querySelector('.running-step-icon').className='running-step-icon done';p.querySelector('.running-step-icon').innerHTML=chk;}if(i<steps.length){const c=steps[i];c.classList.remove('pending');c.querySelector('.running-step-icon').className='running-step-icon active';c.querySelector('.running-step-icon').innerHTML=spn;i++;setTimeout(next,1000+Math.random()*800);}else{setTimeout(()=>{currentState='complete';renderState();},500);}}
      setTimeout(next,600);
    }

    function renderComplete() {
      const selected = wireframes.filter(w => w.selected);
      const figmaSvg = '<svg viewBox="0 0 12 12" fill="none"><path d="M4 12c1.1 0 2-.9 2-2V8H4c-1.1 0-2 .9-2 2s.9 2 2 2z" fill="#0ACF83"/><path d="M2 6c0-1.1.9-2 2-2h2v4H4c-1.1 0-2-.9-2-2z" fill="#A259FF"/><path d="M2 2c0-1.1.9-2 2-2h2v4H4c-1.1 0-2-.9-2-2z" fill="#F24E1E"/><path d="M6 0h2c1.1 0 2 .9 2 2s-.9 2-2 2H6V0z" fill="#FF7262"/><path d="M10 6c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z" fill="#1ABCFE"/></svg>';

      content.innerHTML = `
        <div class="wireframe-grid">
          ${selected.map(w => `
            <div class="wireframe-card">
              <div class="wireframe-preview">
                <div class="wireframe-preview-placeholder">
                  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1"><rect x="4" y="4" width="40" height="40" rx="3"/><rect x="8" y="8" width="32" height="8" rx="1" fill="var(--color-border)"/><rect x="8" y="20" width="14" height="20" rx="1" fill="var(--color-border)"/><rect x="26" y="20" width="14" height="9" rx="1" fill="var(--color-border)"/><rect x="26" y="33" width="14" height="7" rx="1" fill="var(--color-border)"/></svg>
                  ${w.name} wireframe
                </div>
              </div>
              <div class="wireframe-info">
                <div class="wireframe-name">${w.name}</div>
                <div class="wireframe-desc">${w.desc}</div>
                <div class="wireframe-actions">
                  <button class="wireframe-btn primary">${figmaSvg} Open in Figma</button>
                  <button class="wireframe-btn secondary">Preview</button>
                  <button class="wireframe-btn secondary">Iterate</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="delivery-bar">
          <div class="delivery-text">
            ${selected.length} wireframes generated
            <span>Share with your client or save to assets for delivery.</span>
          </div>
          <div class="delivery-actions">
            <button class="btn-ghost"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/><polyline points="8 2 8 10"/><polyline points="5 5 8 2 11 5"/></svg> Share</button>
            <button class="btn-ghost"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14V3a1 1 0 0 1 1-1h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><polyline points="10 2 10 6 14 6"/></svg> Export</button>
            <button class="btn-primary" style="padding:8px 16px;font-size:13px;" onclick="document.body.style.opacity='0';setTimeout(()=>{window.location.href='assets-prototype.html';},180);">Save to Assets</button>
          </div>
        </div>
      `;
    }

    currentState = 'complete';
    renderState();

    // Profile
    (function(){const t=document.getElementById('profileToggle'),d=document.getElementById('profileDropdown');t.addEventListener('click',(e)=>{e.stopPropagation();d.classList.toggle('visible');});document.addEventListener('click',()=>d.classList.remove('visible'));})();
    // Tabs
    document.querySelectorAll('.page-tab').forEach(tab=>{tab.addEventListener('click',(e)=>{e.preventDefault();if(tab.classList.contains('active'))return;document.body.style.transition='opacity 150ms ease-out';document.body.style.opacity='0';setTimeout(()=>{window.location.href=tab.dataset.href;},180);});});
    // Dock
    (function(){const dp=[{name:'Website Redesign',client:'Acme Studio',avatar:'https://randomuser.me/api/portraits/men/32.jpg'},{name:'Brand Identity',client:'Nomad Co',avatar:'https://randomuser.me/api/portraits/women/68.jpg'},{name:'App Design',client:'Pulse Labs',avatar:'https://randomuser.me/api/portraits/men/75.jpg'},{name:'Social Campaign',client:'Vibe Co',avatar:'https://randomuser.me/api/portraits/women/22.jpg'},{name:'Product Strategy',client:'Luna Digital',avatar:'https://randomuser.me/api/portraits/women/50.jpg'},{name:'Editorial Design',client:'Oak Press',avatar:'https://randomuser.me/api/portraits/men/85.jpg'}];const B=44,M=72,S=55,c=document.getElementById('dockContainer');c.innerHTML=dp.map((p,i)=>'<div class="dock-item'+(i===0?' active':'')+'" data-idx="'+i+'"><div class="dock-tooltip"><div class="dock-tooltip-name">'+p.name+'</div><div class="dock-tooltip-client">'+p.client+'</div></div><img src="'+p.avatar+'" alt="'+p.name+'"></div>').join('');const items=[...c.querySelectorAll('.dock-item')];function mag(x){let ci=0,md=Infinity;items.forEach((it,i)=>{const r=it.getBoundingClientRect(),cx=r.left+r.width/2,d=Math.abs(x-cx),sc=Math.exp(-(d*d)/(2*S*S)),sz=Math.round(B+(M-B)*sc);it.style.width=sz+'px';it.style.height=sz+'px';if(d<md){md=d;ci=i;}});items.forEach((it,i)=>{const t=it.querySelector('.dock-tooltip');if(i===ci)t.classList.add('visible');else t.classList.remove('visible');});}c.addEventListener('mouseenter',()=>{items.forEach(it=>{it.style.transition='none';});});c.addEventListener('mousemove',(e)=>{mag(e.clientX);});c.addEventListener('mouseleave',()=>{items.forEach(it=>{it.style.transition='width 200ms ease, height 200ms ease';it.style.width=B+'px';it.style.height=B+'px';it.querySelector('.dock-tooltip').classList.remove('visible');});});items.forEach(it=>{it.addEventListener('click',()=>{document.body.style.opacity='0';setTimeout(()=>{window.location.href='project-detail-prototype.html';},300);});});})();
  </script>
</body>
</html>
