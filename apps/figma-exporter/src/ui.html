<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --stage-purple: #5b55d6; --stage-purple-dark: #463FBA; }
      body { margin: 0; padding: 24px; font: 12px Inter, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
      .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .logo-dot { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, var(--stage-purple), var(--stage-purple-dark)); flex-shrink: 0; }
      .logo-text { font-size: 14px; font-weight: 600; }
      p { margin: 0 0 14px; line-height: 1.5; color: var(--figma-color-text-secondary); }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid var(--figma-color-border); border-radius: 6px; background: var(--figma-color-bg); color: var(--figma-color-text); font: 600 18px monospace; letter-spacing: 0.14em; text-transform: uppercase; text-align: center; }
      input:focus { outline: none; border-color: var(--stage-purple); }
      button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 6px; background: linear-gradient(to bottom, var(--stage-purple), var(--stage-purple-dark)); color: white; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity 0.15s; }
      button:hover:not(:disabled) { opacity: 0.9; }
      button:disabled { cursor: wait; opacity: 0.55; }
      #status { margin-top: 16px; min-height: 18px; line-height: 1.5; }
      #status.working { color: var(--figma-color-text-secondary); }
      #status.error { color: #dc2626; }
      #status.success { color: #16a34a; }
      .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Stage Exporter</span>
    </div>
    <p>Enter the one-time pairing code shown in the Stage desktop app.</p>
    <form id="form">
      <input id="code" autocomplete="off" maxlength="12" placeholder="PAIRING CODE" required autofocus />
      <button id="submit" type="submit">Export to canvas</button>
    </form>
    <div id="status"></div>
    <script>
      const form = document.getElementById("form");
      const code = document.getElementById("code");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        submit.disabled = true;
        status.className = "working";
        status.innerHTML = '<span class="spinner"></span>Starting export...';
        const pairingCode = code.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        parent.postMessage({ pluginMessage: { type: "export", pairingCode } }, "*");
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        status.className = message.status;
        if (message.status === "working") {
          status.innerHTML = '<span class="spinner"></span>' + escapeHtml(message.message);
        } else {
          status.textContent = message.message;
        }
        submit.disabled = message.status === "working";
        if (message.status === "success") {
          submit.textContent = "Done";
          code.value = "";
        }
      };

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
