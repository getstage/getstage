appId: co.getstage.desktop
productName: Stage
copyright: Copyright © Stage
protocols:
  - name: Stage
    schemes:
      - stage
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - from: resources/stage-engine/stage-engine
    to: stage-engine/stage-engine
  - from: resources/wireframe-renderer
    to: wireframe-renderer
  - from: resources/runtime-secrets.env
    to: runtime-secrets.env
  - from: public/apple-touch-icon.png
    to: public/apple-touch-icon.png
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Stage uses your microphone for voice notes and dictation.
  artifactName: "${productName}-${arch}.${ext}"
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
dmg:
  title: "${productName}"
publish:
  provider: github
  owner: getstage
  repo: getstage
  private: false
